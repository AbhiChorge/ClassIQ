<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClassIQ — Sign Up</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="auth-page">

<header class="header">
  <div class="container">
    <div class="headerinner">
      <div class="leftsec">
        <button class="mobilemenu" aria-label="Toggle navigation" aria-expanded="false">☰</button>
  
        <div class="logo"><a href="index.html"><img src="assets/images/logo.png" alt="Logo" width="507" height="147"></a></div>
    
        <nav class="desktopnav">
          <a href="index.html">Home</a>
          <a href="cources.html">Courses</a>
        </nav>
      </div>
  
      <div class="headeractions">
        <a class="btn btnblack" href="login.html">Login</a>
        <a class="btn btnblack" href="signup.html">Sign Up</a>
      </div>
    </div>
  </div>
</header>

<main class="auth-main signupcard">
  <section class="authcard">
    <h1>Login</h1>

    <form id="signupForm" novalidate>
      <div class="field">
        <input id="signupEmail" type="email" placeholder="Enter Your Email" autocomplete="email">
        <p data-error="signupEmail"></p>
      </div>

      <label class="field">
        <input id="signupName" type="text" placeholder="Your full name" autocomplete="name">
        <p data-error="signupName"></p>
      </label>

      <div class="field">
        <input id="signupPassword" type="password" placeholder="Enter Your Password" autocomplete="current-password">
        <p data-error="signupPassword"></p>
      </div>

      <button class="btn btngreen btnfull" type="submit">SignUp</button>

      <p id="signupMessage" class="formmessage"></p>
    </form>

    <p class="authswitch">Already have an account? <a href="login.html">Login</a></p>
  </section>
</main>


<script src="assets/js/app.js"></script>

</body>
</html>
